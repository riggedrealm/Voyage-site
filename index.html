<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Joestar Gang</title>
<meta name="description" content="Player tracker for the Joestar Gang: where things stand, who's who and what's still open.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Tokens: ink-on-paper manga, crew cobalt, Kobuncho neon, Hearth amber */
:root{
 --paper:#F3F5FA;--panel:#FFFFFF;--ink:#0E1430;--ink2:#4B5476;--edge:#0E1430;--rule:#C9CFE0;--tone:rgba(14,20,48,.13);
 --cobalt:#2448E0;--neon:#E0186E;--amber:#C77A00;--ok:#0F8A5F;--bad:#C42B2B;--warn:#A86400;
 --display:"Dela Gothic One","Noto Sans CJK JP Black","Arial Black",Impact,sans-serif;
 --body:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",sans-serif;
 color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --paper:#0A0F26;--panel:#121A3A;--ink:#E9ECF7;--ink2:#A6AED0;--edge:#8E98C8;--rule:#27305A;--tone:rgba(233,236,247,.10);
 --cobalt:#6F8CFF;--neon:#FF4C9B;--amber:#F2A93B;--ok:#43D19A;--bad:#FF7468;--warn:#F2B64E}}
:root[data-theme="dark"]{--paper:#0A0F26;--panel:#121A3A;--ink:#E9ECF7;--ink2:#A6AED0;--edge:#8E98C8;--rule:#27305A;--tone:rgba(233,236,247,.10);--cobalt:#6F8CFF;--neon:#FF4C9B;--amber:#F2A93B;--ok:#43D19A;--bad:#FF7468;--warn:#F2B64E}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.65 var(--body);padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit}
:focus-visible{outline:3px solid var(--neon);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;margin:0;line-height:1.15}

/* Masthead */
.mast{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:3px solid var(--edge);padding:max(10px,env(safe-area-inset-top)) 16px 0}
.mrow{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-bottom:8px}
.word{font-family:var(--display);font-size:22px;line-height:1;transform:skewX(-8deg);white-space:nowrap}
.word span{color:var(--cobalt)}
.search{margin-left:auto;flex:1;max-width:300px}
.search input{width:100%;padding:8px 12px;border:2px solid var(--edge);border-radius:0;background:var(--panel);color:var(--ink);font:inherit;font-size:15px}
nav{max-width:1120px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;padding:8px 14px 9px;text-decoration:none;font-weight:700;color:var(--ink2);border:2px solid transparent;border-bottom:0;margin-bottom:-3px}
nav a[aria-current=page]{color:var(--ink);background:var(--panel);border-color:var(--edge);border-bottom:3px solid var(--panel)}

main{max-width:1120px;margin:0 auto;padding:22px 16px 56px}
.sub{color:var(--ink2);margin:6px 0 20px;max-width:62ch}
.pagehead h1{font-size:clamp(30px,6vw,46px)}
.sec{margin:34px 0 12px;font-size:21px;display:flex;align-items:baseline;gap:12px}
.sec small{font-family:var(--body);font-size:14px;color:var(--ink2);font-weight:500}

/* Panels: ink border, square corners, gutters */
.panel{background:var(--panel);border:2px solid var(--edge)}
.gutter{display:grid;gap:10px}

/* Now: the splash panel (the one bold move) */
.splash{position:relative;overflow:hidden;background:#2448E0;color:#fff;border:3px solid var(--edge);
 clip-path:polygon(0 0,100% 0,100% calc(100% - 38px),0 100%);padding:22px 20px 70px;min-height:300px}
.splash:before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.22) 1.4px,transparent 1.6px) 0 0/9px 9px;
 -webkit-mask:linear-gradient(115deg,transparent 35%,#000 85%);mask:linear-gradient(115deg,transparent 35%,#000 85%);pointer-events:none}
.sfx{position:absolute;right:10px;top:8px;font-family:var(--display);font-size:clamp(58px,13vw,120px);line-height:.92;color:#fff;opacity:.2;
 writing-mode:vertical-rl;letter-spacing:-.06em;pointer-events:none;animation:menace 1.6s ease-out 1}
@keyframes menace{0%{transform:translateX(18px) scale(1.06);opacity:0}100%{transform:none;opacity:.2}}
.capbox{position:relative;display:inline-block;background:var(--panel);color:var(--ink);border:2px solid var(--edge);padding:8px 14px;max-width:min(560px,82%)}
.capbox h1{font-size:clamp(26px,5.4vw,40px)}
.capbox p{margin:2px 0 0;color:var(--ink2);font-size:15px;line-height:1.45}
.balloon{position:relative;margin:18px 0 0;max-width:62ch;font-size:17px;line-height:1.6;color:#fff;max-width:min(62ch,86%)}
.clock{display:inline-block;margin-top:14px;background:var(--neon);color:#fff;font-weight:700;padding:3px 10px;border:2px solid var(--edge)}
.cast{display:flex;gap:8px;margin:-26px 0 0 14px;position:relative;z-index:1;flex-wrap:wrap}
.cast button{all:unset;cursor:pointer;width:58px;height:58px;border:2px solid var(--edge);background:var(--panel);overflow:hidden;display:grid;place-items:center;font-weight:700}
.cast button:nth-child(odd){transform:rotate(-2deg)}.cast button:nth-child(even){transform:rotate(2deg)}
.cast img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.cast button:focus-visible{outline:3px solid var(--neon);outline-offset:2px}

/* Threads: priority is the weight of the spine */
.threads{border:2px solid var(--edge);background:var(--panel)}
.th{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 14px;border-top:2px solid var(--rule)}
.th:first-child{border-top:0}
.th .sp{width:6px;background:var(--rule);align-self:stretch}
.th.high .sp{background:var(--neon);width:9px}.th.med .sp{background:var(--cobalt)}
.th b{display:block;font-weight:700;line-height:1.35}
.th p{margin:2px 0 0;color:var(--ink2);font-size:15px;line-height:1.55;max-width:70ch}
.th.done b{text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink2)}
.pri{font-size:13px;color:var(--ink2);font-weight:500}
.th.high .pri{color:var(--neon);font-weight:700}

/* Arcs read as volumes */
.vol{border:2px solid var(--edge);background:var(--panel);margin-bottom:10px}
.vol summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 14px}
.vol summary::-webkit-details-marker{display:none}
.vno{font-family:var(--display);font-size:28px;line-height:1;color:var(--cobalt);min-width:1.4em}
.vol.active .vno{color:var(--neon)}
.vt{font-weight:700;line-height:1.3}.vt small{display:block;color:var(--ink2);font-weight:400;font-size:14px}
.vol summary:after{content:"+";font-family:var(--display);font-size:22px;color:var(--ink2)}
.vol[open] summary:after{content:"\2212"}
.vb{padding:0 14px 14px 14px;border-top:2px dashed var(--rule)}
.vb p{max-width:68ch;margin:12px 0 10px;color:var(--ink2)}
.beats{list-style:none;margin:0;padding:0;counter-reset:b}
.beats li{counter-increment:b;display:grid;grid-template-columns:2.2em 1fr;gap:6px;padding:7px 0;border-top:1px solid var(--rule)}
.beats li:before{content:counter(b);font-family:var(--display);color:var(--ink2)}
.beats li.now:before{color:var(--neon)}
.beats b{font-weight:700}.beats span{color:var(--ink2);font-size:15px}
.tag-now{color:var(--neon);font-weight:700}

/* Character panels */
.roster{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.char{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--edge);position:relative}
.char:focus-visible{outline:3px solid var(--neon);outline-offset:2px}
.char .ph{aspect-ratio:4/5;background:var(--tone);overflow:hidden;display:grid;place-items:center;border-bottom:2px solid var(--edge);
 background-image:radial-gradient(var(--tone) 1.3px,transparent 1.5px);background-size:8px 8px}
.char .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.char .ph i{font-family:var(--display);font-style:normal;font-size:42px;color:var(--ink2)}
.char .cb{margin:-22px 8px 0;background:var(--panel);border:2px solid var(--edge);padding:5px 9px;position:relative}
.char .cb b{display:block;line-height:1.25;font-size:15.5px}
.char .cb small{display:block;color:var(--ink2);font-size:13px;line-height:1.35}
.char .tx{margin:8px 10px 12px;padding:0;font-size:14px;color:var(--ink2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.char .st{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:700;padding:8px 10px 0}
.char.foe{border-color:var(--bad)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ink2);flex:none}
.s-active .dot{background:var(--ok)}.s-pending .dot,.s-watch .dot{background:var(--cobalt)}
.s-unresolved .dot,.s-fled .dot{background:var(--warn)}.s-dead .dot,.s-hostile .dot,.s-destroyed .dot,.s-arrested .dot{background:var(--bad)}

/* Places */
.places{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.place{background:var(--panel);border:2px solid var(--edge);padding:12px 14px}
.place b{display:block;font-size:17px;line-height:1.3}
.place .st{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:700;margin:4px 0}
.place p{margin:0;color:var(--ink2);font-size:15px}
.place.faction{border-width:2px 2px 2px 9px}

/* Story timeline */
.tl{list-style:none;margin:0;padding:0;border-left:3px solid var(--edge);margin-left:6px}
.tl li{position:relative;padding:0 0 18px 18px;max-width:72ch}
.tl li:before{content:"";position:absolute;left:-9px;top:6px;width:13px;height:13px;background:var(--panel);border:3px solid var(--edge);transform:rotate(45deg)}
.tl b{display:block;font-family:var(--display);font-weight:400;font-size:15px;color:var(--cobalt)}
.tl span{color:var(--ink)}

.empty{padding:28px 16px;border:2px dashed var(--rule);text-align:center;color:var(--ink2)}

/* Org chart */
main.wide{max-width:1180px}
.crest{position:relative;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;color:#fff;border:3px solid var(--edge);
 background:linear-gradient(104deg,#1B3AB8 0%,#2448E0 49.6%,var(--edge) 49.6%,var(--edge) 50.4%,#D88A12 50.4%,#8A4B05 100%)}
.crest:before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.18) 1.4px,transparent 1.6px) 0 0/9px 9px;pointer-events:none;
 -webkit-mask:radial-gradient(circle at 50% 0,#000,transparent 70%);mask:radial-gradient(circle at 50% 0,#000,transparent 70%)}
.crest .ct{grid-column:1/-1;text-align:center;padding:22px 16px 2px;position:relative}
.crest .ct h1{font-size:clamp(28px,5vw,44px);color:#fff}
.crest .ct p{margin:4px 0 0;color:rgba(255,255,255,.9);font-size:15px}
.crest .half{display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px 12px 46px;position:relative}
.crest .pt{all:unset;cursor:pointer;width:clamp(86px,14vw,124px);aspect-ratio:1;border:3px solid #fff;overflow:hidden;background:rgba(255,255,255,.15);display:grid;place-items:center;font-weight:700;font-size:26px}
.crest .half:first-of-type .pt{transform:rotate(-2deg)}.crest .half:last-of-type .pt{transform:rotate(2deg)}
.crest .pt img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.crest .pt:focus-visible{outline:3px solid #fff;outline-offset:3px}
.crest h3{margin:12px 0 0;font-size:clamp(17px,2.4vw,22px);color:#fff}
.crest .br{margin-top:4px;font-size:14px;color:rgba(255,255,255,.92)}
.crest .own{grid-column:1/-1;text-align:center;font-size:14px;color:#fff;padding:0 16px 40px;margin-top:-28px;position:relative}
.ltrow{display:flex;justify-content:center;margin-top:-24px;position:relative;z-index:1;padding:0 10px}
.ltcol{display:flex;flex-direction:column;align-items:stretch;gap:8px;max-width:440px;width:100%}
.ltpill{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:center;background:var(--panel);border:3px solid var(--edge);padding:10px 14px 10px 10px}
.ltpill:focus-visible{outline:3px solid var(--neon);outline-offset:2px}
.ltpill b{display:block;line-height:1.25;font-size:17px}.ltpill small{display:block;color:var(--ink2);font-size:13.5px;line-height:1.4}
.ltpill .rk{color:var(--neon);font-weight:700;font-size:13.5px}
.ltseats{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--panel);border:2px solid var(--edge);padding:4px}
.legend{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;margin:18px 0 6px;font-size:14px;color:var(--ink2)}
.legend span{display:inline-flex;gap:7px;align-items:center}
.legend i{width:16px;height:16px;display:inline-block;flex:none}
.legend .k1{background:var(--neon);border:2px solid var(--edge)}.legend .k2{border:2px dashed var(--ink2)}
.branches{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start;margin-top:8px}
.branch{display:flex;flex-direction:column;gap:10px}
.bh{background:var(--panel);border:3px solid var(--edge);border-top:10px solid var(--bc);padding:14px 16px}
.bh .bt{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bh h2{font-size:30px}
.bh .tag{color:var(--bc);font-weight:700;font-size:15px}
.bh p{margin:4px 0 0;color:var(--ink2);font-size:15px}
.dvx{background:var(--panel);border:2px solid var(--edge);border-left:9px solid var(--c);padding:12px 12px 6px}
.dvx .dh2{display:flex;align-items:baseline;gap:10px;padding:0 4px}
.dvx .dh2 b{font-family:var(--display);font-weight:400;font-size:20px;line-height:1.1}
.dvx .dh2 .tag{color:var(--c);font-weight:700;font-size:13.5px}
.meter{margin-left:auto;display:flex;gap:3px;align-self:center}
.meter i{width:10px;height:10px;border:2px solid var(--c)}
.meter i.on{background:var(--c)}
.dvx .ab{margin:3px 4px 8px;color:var(--ink2);font-size:14px}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px}
.seat{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;padding:7px;min-width:0}
button.seat{cursor:pointer}button.seat:hover{background:var(--tone)}
.seat:focus-visible{outline:3px solid var(--neon);outline-offset:1px}
.sa{width:42px;height:42px;flex:none;overflow:hidden;border:2px solid var(--c,var(--edge));background:var(--tone);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.ltpill .sa{width:54px;height:54px;border-color:var(--neon)}
.sa img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.seat .tx{min-width:0}
.seat b{display:block;font-size:15px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat small{display:block;color:var(--ink2);font-size:13px;line-height:1.35}
.seat.open .sa{border:2px dashed var(--c);background:transparent;color:var(--c);font-size:22px;font-family:var(--display)}
.seat.open b{color:var(--ink2);font-weight:500}
.seat.open small{white-space:normal}
.seat.open.w1{background:color-mix(in srgb,var(--neon) 9%,var(--panel));outline:2px solid var(--neon);outline-offset:-2px}
.seat.open.w1 .sa{border:2px solid var(--edge);background:var(--neon);color:#fff}
.seat.open.w1 b{color:var(--ink);font-weight:700}
.seat.open.w1 em{font-style:normal;font-weight:700;color:var(--neon)}
.seat.open.w2{opacity:.68}.seat.open.w2:hover{opacity:1}
.seat .cv{display:block;font-style:italic}
.house{border:2px dashed var(--edge);padding:12px 14px}
.house b.hn{font-family:var(--display);font-weight:400;font-size:18px}
.house p{margin:2px 0 6px;color:var(--ink2);font-size:14px}
.orgfoot{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;margin-top:10px}
.want{border:2px solid var(--edge);background:var(--panel);padding:2px 14px}
.want .wr{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--rule)}
.want .wr:first-child{border-top:0}
.want .wn{flex:none;width:96px;font-weight:700;font-size:14px;color:var(--c)}
.want .ws{display:flex;flex-wrap:wrap;gap:6px}
.want .ws span{font-size:13px;padding:1px 9px;border:2px dashed var(--c);color:var(--ink)}
.want .ws span.hd{border-style:solid;font-weight:700}
.want.first .ws span{border:2px solid var(--neon)}
details.later{margin-top:10px;border:2px solid var(--edge);background:var(--panel)}
details.later summary{cursor:pointer;padding:10px 14px;font-weight:700}
details.later .want{border:0;border-top:2px dashed var(--rule)}
.rules .row{padding:10px 14px;border-top:1px solid var(--rule)}.rules .row:first-child{border-top:0}
.rules .row b{display:block}.rules .row p{margin:0;color:var(--ink2);font-size:15px}

/* Dialog */
dialog{border:3px solid var(--edge);border-radius:0;padding:0;background:var(--panel);color:var(--ink);width:min(580px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(10,15,38,.6)}
.dshot{display:block;width:100%;max-height:360px;object-fit:cover;object-position:50% 10%;border-bottom:3px solid var(--edge)}
.dh{display:flex;gap:12px;align-items:flex-start;padding:16px 18px 10px}
.dh h3{font-size:26px}
.dh .st{display:flex;gap:6px;align-items:center;font-size:14px;font-weight:700;margin-top:6px}
.dh button{margin-left:auto;flex:none;border:2px solid var(--edge);background:var(--panel);color:var(--ink);width:40px;height:40px;font-size:22px;cursor:pointer}
.db{padding:0 18px 22px;overflow:auto;max-height:calc(90vh - 120px)}
.db .role{color:var(--ink2);margin:0 0 10px}
.db p{margin:0 0 12px;max-width:66ch}
.db pre{white-space:pre-wrap;font:inherit;font-size:15px;color:var(--ink2);margin:0;border-top:2px dashed var(--rule);padding-top:12px}
.foot{color:var(--ink2);font-size:13px;text-align:center;padding:24px 16px}

@media (max-width:860px){
 .branches,.orgfoot{grid-template-columns:1fr}
}
@media (max-width:700px){
 .mast{padding-bottom:10px}.mrow{padding-bottom:0}
 nav{position:fixed;left:0;right:0;bottom:0;max-width:none;margin:0;overflow:visible;background:var(--panel);border-top:3px solid var(--edge);padding:0 0 env(safe-area-inset-bottom);z-index:6}
 nav a{flex:1;text-align:center;padding:11px 0 10px;font-size:11.5px;letter-spacing:-.01em;border:0;margin:0}
 nav a[aria-current=page]{background:var(--ink);color:var(--paper);border:0}
 main{padding-bottom:96px}
 dialog{width:100vw;max-width:100vw;margin:auto 0 0;max-height:92vh;border-width:3px 0 0}
 .roster{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .splash{padding:18px 16px 64px}
 .ltseats{grid-template-columns:1fr}
}
@media (max-width:420px){.word{font-size:19px}.crest .half{padding:14px 6px 42px}.crest .br{font-size:13px}}
@media (prefers-reduced-motion:reduce){.sfx{animation:none}*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="mast">
 <div class="mrow"><div class="word" aria-label="Joestar Gang">Joestar <span>Gang</span></div>
 <div class="search"><input id="q" type="search" placeholder="Search people, places, threads" aria-label="Search the tracker"></div></div>
 <nav id="nav" aria-label="Sections"></nav>
</header>
<main id="view"></main>
<p class="foot">Player view. Spoilers stay off this page.</p>
<dialog id="dlg" aria-labelledby="dt"><div id="dshotwrap"></div><div class="dh"><div><h3 id="dt"></h3><div id="dm"></div></div><button type="button" id="dx" aria-label="Close">&times;</button></div><div class="db" id="dbody"></div></dialog>
<script>

rdially with 'ask around Kobuncho for Ginji Ozu'."}, {"id": "amemiya-parents", "name": "Amemiya parents", "kind": "neutral", "role": "Noa's family; shopkeepers", "division": "", "status": "active", "note": "at their shop", "summary": "Found a cash envelope with no note. Collectors have hung around their shop all week. Reiko has promised to stand in front of it if collectors come."}, {"id": "rei", "name": "Rei Ichinose", "kind": "neutral", "role": "Academy Liaison (Internal Affairs)", "division": "", "status": "watch", "note": "in the school corridor outside the gym storage room", "summary": "Principal Anya's neutral liaison for the club. Flat, clinical, by the book; school matters only (no reach over Vault money, Rin or off-campus work). Lifts every mat after the last bell. At t465 logged one 'material anomaly' (a mat that would not lift) and at t466 asked what the club actually intends. Anya accepts the club's charter only if Rei joins."}], "places": [{"id": "kurokawa", "name": "Kurokawa syndicate", "kind": "faction", "status": "hostile", "summary": "Daigo Renjiro's syndicate with four pillars.", "group": ""}, {"id": "gang", "name": "Joestar Crew", "kind": "faction", "status": "active", "summary": "Two branches, 11 divisions, one district.", "group": ""}, {"id": "speedwagon", "name": "Speedwagon Foundation", "kind": "faction", "status": "active", "summary": "Funds the crew through Aurelia Voss.", "group": ""}, {"id": "seiran", "name": "Seiran Tech", "kind": "faction", "status": "watch", "summary": "Kenji Aoi's school. A student was knocked out by Jostin earlier.", "group": ""}, {"id": "steam-lantern-alley", "name": "Steam Lantern Alley", "kind": "place", "status": "active", "summary": "Narrow late-night alley of food carts, steaming grills, noodle counters, and improvised tables beneath layered neon signs.", "group": "Chikara Tokyo"}, {"id": "chikara-student-residences", "name": "Chikara Student Residences", "kind": "place", "status": "active", "summary": "Anime-style student apartments where characters live, rest, study, cook, and host relationship scenes", "group": "Chikara Tokyo"}, {"id": "second-signal", "name": "Second Signal", "kind": "place", "status": "active", "summary": "Late-night pawnshop buying, selling, and appraising ordinary goods, stolen valuables, obscure technology, and questionable support equipment.", "group": "Chikara Tokyo"}, {"id": "goshiki-high-rises", "name": "Goshiki High-Rises", "kind": "place", "status": "active", "summary": "Chiikawa Park is a rare patch of green squeezed between Tower Four and Tower Five, built on the site of an old community center that was demolished…", "group": "Goshiki High-Rises"}, {"id": "deadbeats-club", "name": "Deadbeats Club", "kind": "place", "status": "active", "summary": "A shared four-bedroom house in Tokyo designed as an open sandbox hub for solo or multiplayer characters", "group": "Chikara Tokyo"}, {"id": "glassline", "name": "Glassline", "kind": "place", "status": "active", "summary": "Corporate towers, banks, legal offices, and executive restaurants in Tokyo's business core.", "group": "Chikara Tokyo"}, {"id": "student-clinic", "name": "Student Clinic", "kind": "place", "status": "active", "summary": "A walk-in neighborhood clinic serving academy students, residents, and workers with routine care, minor injuries, and referrals.", "group": "Chikara Tokyo"}, {"id": "riverside-food-market", "name": "Riverside Food Market", "kind": "place", "status": "active", "summary": "A lively market near the river with produce stalls, prepared food, household basics, and inexpensive groceries for students and residents.", "group": "Chikara Tokyo"}, {"id": "kobuncho", "name": "Kobuncho", "kind": "place", "status": "active", "summary": "Kobuncho is a nightlife district whose daytime quiet hides a web of cabaret hostesses, retired yakuza fixers, off-duty hero informants, and the staff…", "group": "Chikara Tokyo"}, {"id": "chikara-academy", "name": "Chikara Academy", "kind": "place", "status": "active", "summary": "A prestigious superhero university in Tokyo combining rigorous academics, power training, rescue simulations, student life, supervised hero…", "group": "Chikara Tokyo"}, {"id": "sakura-lane-sharehouse", "name": "Sakura Lane Sharehouse", "kind": "place", "status": "active", "summary": "Furnished sharehouse in the Academy area offering eight individually assigned private bedrooms, shared facilities, and a safe rooftop terrace for…", "group": "Chikara Tokyo"}, {"id": "club-kagero", "name": "Club Kagero", "kind": "place", "status": "destroyed", "summary": "Club Kagero ('heat haze', Neon Lantern Street): publicly shuttered satellite; in truth an invite-only after-hours front with a school on the closed upper floor. Collapsed into the earth at t327 (Peach Aftershock) with its archive.", "group": "Chikara Tokyo"}, {"id": "club-lumiere", "name": "Club Lumiere", "kind": "place", "status": "active", "summary": "The crew's base on Neon Lantern Street, Kobuncho; owned by Jovian.", "group": "Chikara Tokyo"}], "threads": [{"title": "Ledger leverage", "detail": "Finance fell; the ledger is spent.", "state": "parked", "priority": "high"}, {"title": "Safehouse", "detail": "Gym storage-room shelter is the working HQ (hatch hidden under a false-floor panel). Raid fund 70% locked with Haruto; first draw released by Rin.", "state": "open", "priority": "med"}, {"title": "Ayame's stream", "detail": "Ayame's trending stream advertised the rematch and drew the collectors; blurred clips circulate; a Kurokawa-side viewer may now know her face.", "state": "open", "priority": "med"}, {"title": "Shun and Daiki", "detail": "", "state": "parked", "priority": "low"}, {"title": "Kenji Aoi", "detail": "Not an ally.", "state": "parked", "priority": "low"}, {"title": "Riko", "detail": "Merged into the Ayame date thread; Jostin told Ayame that Riko is a friend and sparring partner.", "state": "parked", "priority": "med"}, {"title": "Finance lead", "detail": "Rin hire
