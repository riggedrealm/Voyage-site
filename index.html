<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Joestar Gang Tracker</title>
<meta name="description" content="Player-facing campaign tracker for the Joestar Gang.">
<style>
:root{--bg:#f6f7f9;--surface:#fff;--s2:#eef0f4;--fg:#161a22;--muted:#5d6676;--line:#dde1e8;--accent:#c8243f;--accent-soft:#fbe7eb;--ok:#12805c;--warn:#a96a00;--bad:#c0302b;--info:#2b6cb0;--r:14px;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0e1117;--surface:#161b24;--s2:#1d2330;--fg:#eef1f6;--muted:#9aa5b8;--line:#2a3243;--accent:#ff6a84;--accent-soft:#3a1a24;--ok:#4cd6a0;--warn:#f2c15a;--bad:#ff7a72;--info:#7ab8ff}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:max(10px,env(safe-area-inset-top)) 16px 0}
.bar{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{font-weight:800;letter-spacing:.01em}.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}
.search{margin-left:auto;flex:1;max-width:280px}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit}
nav{max-width:960px;margin:6px auto 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;padding:9px 12px;border-bottom:3px solid transparent;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap}
nav a[aria-current=page]{color:var(--accent);border-color:var(--accent)}
main{max-width:960px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}.sub{color:var(--muted);margin:0 0 18px}
h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.now{border-left:4px solid var(--accent);padding:16px 18px}
.now .l{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.now p{margin:6px 0 0;font-size:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
button.item{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:14px 16px}
button.item:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.item .t{display:flex;gap:10px;align-items:center}
.av{width:54px;height:54px;border-radius:15px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;overflow:hidden;border:2px solid var(--dv,var(--line))}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.hero{position:relative;overflow:hidden;border-radius:20px;padding:22px 20px 18px;color:#fff;background:linear-gradient(135deg,#c8243f 0%,#6b1d52 55%,#1f2a5a 100%);margin-bottom:6px}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero small{opacity:.8;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.hero h1{font-size:26px;margin:4px 0 2px;color:#fff}.hero .sub{color:rgba(255,255,255,.82);margin:0 0 14px}
.faces{display:flex}.faces .av{width:44px;height:44px;border-radius:50%;border:2px solid #fff;margin-left:-10px;font-size:12px}.faces .av:first-child{margin-left:0}
.card.dvc{border-top:3px solid var(--dv)}
.shot{display:block;width:100%;max-height:340px;object-fit:cover;object-position:50% 10%}
.item b{display:block;font-weight:700;line-height:1.25}.item small{color:var(--muted)}
.item p{margin:8px 0 0;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px;background:var(--s2);border:1px solid var(--line);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.st-active .dot{background:var(--ok)}.st-pending .dot,.st-watch .dot{background:var(--info)}.st-unresolved .dot,.st-fled .dot{background:var(--warn)}.st-dead .dot,.st-hostile .dot,.st-destroyed .dot{background:var(--bad)}
.row{padding:12px 16px;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.row b{display:block}.row p{margin:2px 0 0;color:var(--muted);font-size:14px}
.pr{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--s2);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.pr.high{background:var(--accent-soft);color:var(--accent)}
.done b{text-decoration:line-through;color:var(--muted)}
.tl{margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);list-style:none}
.tl li{position:relative;padding:0 0 16px 14px}
.tl li:before{content:"";position:absolute;left:-24px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--bg)}
.tl b{font-size:12px;color:var(--accent);display:block}
details.card{margin-bottom:10px}
summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;gap:10px;align-items:center}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";margin-left:auto;color:var(--muted)}
details[open] summary:after{content:"\2212"}
.body{padding:0 16px 14px}
.body ul{margin:4px 0 0;padding-left:20px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:18px;padding:0;background:var(--surface);color:var(--fg);width:min(560px,94vw);max-height:88vh}
dialog::backdrop{background:rgba(8,10,16,.55)}
.dh{display:flex;gap:12px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.dh h3{margin:0;font-size:20px}.dh button{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:50%;width:36px;height:36px;font-size:20px;cursor:pointer}
.db{padding:16px 20px 22px;overflow:auto;max-height:calc(88vh - 90px)}
.db p{margin:0 0 12px}.db pre{white-space:pre-wrap;font:inherit;color:var(--muted);margin:0}
.foot{color:var(--muted);font-size:12px;text-align:center;padding:24px 16px}

main.wide{max-width:1180px}
.crest{position:relative;display:grid;grid-template-columns:1fr 1fr;border-radius:24px;overflow:hidden;color:#fff;background:linear-gradient(104deg,#173a8f 0%,#2f6fe4 49.7%,#e39a1f 50.3%,#7d4306 100%)}
.crest:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0,rgba(255,255,255,.18),transparent 55%);pointer-events:none}
.crest .ct{grid-column:1/-1;text-align:center;padding:26px 16px 4px;position:relative}
.crest .ct h1{color:#fff;font-size:clamp(24px,4.4vw,36px);letter-spacing:-.02em;margin:0;line-height:1.1}
.crest .ct p{margin:6px 0 0;color:rgba(255,255,255,.85);font-size:14px}
.crest .half{display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 14px 40px;position:relative}
.crest .pt{all:unset;cursor:pointer;width:clamp(84px,14vw,128px);aspect-ratio:1;border-radius:26px;border:3px solid rgba(255,255,255,.92);overflow:hidden;background:rgba(255,255,255,.16);display:grid;place-items:center;font-weight:800;font-size:28px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.crest .pt img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.crest .pt:focus-visible{outline:3px solid #fff;outline-offset:3px}
.crest h3{margin:12px 0 0;font-size:clamp(16px,2.2vw,21px);line-height:1.2}
.crest .br{margin-top:4px;font-size:13px;color:rgba(255,255,255,.9)}
.crest .br strong{font-weight:800}
.crest .own{grid-column:1/-1;text-align:center;font-size:12.5px;color:rgba(255,255,255,.88);padding:0 16px 34px;margin-top:-22px;position:relative}
.ltrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;margin-top:-18px;position:relative;z-index:1}
.ltrow .stub{justify-self:center;width:2px;height:58px;margin-top:18px;background:var(--line)}
.ltpill{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 16px 10px 10px;box-shadow:0 10px 26px rgba(10,14,25,.14);max-width:380px}
.ltcol{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:420px}
.ltseats{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px}
@media (max-width:520px){.ltseats{grid-template-columns:1fr}}
.ltpill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ltpill b{display:block;line-height:1.2}.ltpill small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.ltpill .rk{color:var(--accent);font-weight:700;font-size:12.5px}
.branches{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start;margin-top:4px}
.branch{display:flex;flex-direction:column;gap:12px}
.bh{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--bc);border-radius:18px;padding:16px 18px}
.bh .bt{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bh h2{all:unset;font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--fg)}
.bh .tag{color:var(--bc);font-weight:700;font-size:14px}
.bh p{margin:4px 0 0;color:var(--muted);font-size:14px}
.bh .staff{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);display:grid;grid-template-columns:1fr 1fr;gap:4px}
.bh .staff .cap{grid-column:1/-1;font-size:12.5px;color:var(--muted);font-weight:600;padding:0 8px}
.dvx{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:16px;padding:14px 14px 8px}
.dvx .dh2{display:flex;align-items:center;gap:10px;padding:0 4px}
.dvx .dh2 b{font-size:17px;letter-spacing:-.01em}
.dvx .dh2 .tag{color:var(--c);font-weight:700;font-size:12.5px}
.dvx .meter{margin-left:auto;display:flex;gap:4px;align-items:center}
.dvx .meter i{width:9px;height:9px;border-radius:50%;border:2px solid var(--c)}
.dvx .meter i.on{background:var(--c)}
.dvx .ab{margin:3px 4px 8px;color:var(--muted);font-size:13.5px}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:2px}
.seat{all:unset;box-sizing:border-box;display:flex;gap:11px;align-items:center;padding:8px;border-radius:12px;min-width:0}
button.seat{cursor:pointer}button.seat:hover{background:var(--s2)}
.seat:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seat .sa,.ltpill .sa{width:42px;height:42px;border-radius:50%;flex:none;overflow:hidden;border:2px solid var(--c,var(--line));background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px}
.ltpill .sa{width:52px;height:52px}
.seat .sa img,.ltpill .sa img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.seat .tx{min-width:0}
.seat b{display:block;font-size:14.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}
.seat.open .sa{border:2px dashed color-mix(in srgb,var(--c) 55%,var(--line));background:transparent;color:var(--c);font-size:22px;font-weight:400}
.seat.open b{color:var(--muted);font-weight:600}
.seat.open small{white-space:normal}
.house{border:1px dashed var(--line);border-radius:16px;padding:12px 14px;background:var(--s2)}
.house b{font-size:15px}.house p{margin:2px 0 6px;color:var(--muted);font-size:13px}
.orgfoot{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;margin-top:8px}
.rules .row b{font-size:14px}
.want{padding:4px 16px 12px}
.want .wr{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.want .wr:first-child{border-top:0}
.want .wn{flex:none;width:92px;font-weight:700;font-size:13.5px;color:var(--c)}
.want .ws{display:flex;flex-wrap:wrap;gap:6px}
.want .ws span{font-size:12.5px;padding:2px 9px;border-radius:99px;border:1px dashed color-mix(in srgb,var(--c) 60%,var(--line));color:var(--fg)}
.want .ws span.hd{border-style:solid;font-weight:700}

.seat.open.w1{background:color-mix(in srgb,var(--c) 11%,var(--surface));box-shadow:inset 0 0 0 1.5px var(--c)}
.seat.open.w1 .sa{border-style:solid;background:var(--c);color:#fff}
.seat.open.w1 b{color:var(--fg);font-weight:800}
.seat.open.w1 small em{font-style:normal;font-weight:800;color:var(--c)}
.seat.open.w2{opacity:.62}
.seat.open.w2:hover{opacity:1}
.seat.open small .cv{display:block;color:var(--muted);font-style:italic}
.plan{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;margin:14px 2px 2px;font-size:13.5px;color:var(--muted)}
.plan span{display:inline-flex;gap:7px;align-items:center}
.plan i{width:16px;height:16px;border-radius:50%;display:inline-block;flex:none}
.plan .k1{background:var(--accent);border:2px solid var(--accent)}
.plan .k2{border:2px dashed var(--muted);opacity:.7}
.plan .k3{border:2px solid var(--ok)}
.want .wr.w1row{background:color-mix(in srgb,var(--c) 8%,transparent)}
details.later{margin-top:10px}
details.later .want{padding-top:0}
@media (max-width:860px){
.branches,.orgfoot{grid-template-columns:1fr}
.ltrow{grid-template-columns:1fr;padding:0 10px}.ltrow .stub{display:none}.ltpill{justify-self:center}
.bh .staff{grid-template-columns:1fr}
}
@media (max-width:420px){.crest .half{padding:14px 8px 38px}.crest .br{font-size:12px}}
@media (max-width:700px){
header{padding-bottom:10px}
nav{position:fixed;left:0;right:0;bottom:0;max-width:none;margin:0;gap:0;overflow:visible;background:var(--surface);border-top:1px solid var(--line);padding:0 0 env(safe-area-inset-bottom);z-index:6}
nav a{flex:1;text-align:center;padding:12px 0 11px;font-size:11.5px;border-bottom:0;border-top:3px solid transparent}
nav a[aria-current=page]{border-top-color:var(--accent)}
main{padding-bottom:92px}
dialog{width:100vw;max-width:100vw;margin:auto 0 0;max-height:92vh;border-radius:18px 18px 0 0;border-bottom:0}
}
@media (max-width:560px){.search{max-width:none}.brand small{display:none}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <div class="bar"><div class="brand">Joestar Gang<small>Campaign tracker</small></div>
  <div class="search"><input id="q" type="search" placeholder="Search" aria-label="Search the tracker"></div></div>
  <nav id="nav" aria-label="Sections"></nav>
</header>
<main id="view"></main>
<p class="foot">Player view. Spoilers are not included.</p>
<dialog id="dlg"><div class="dh"><div class="av" id="dav"></div><div><h3 id="dt"></h3><div id="dm"></div></div><button type="button" id="dx" aria-label="Close">&times;</button></div><div class="db" id="dbody"></div></dialog>
<script>
var D={"now": {"when": "Tuesday night", "location": "Club Lumiere, Kobuncho (night before the cash run)", "summary": "The crew chose to fight Marumo's collectors. Haruto and Jovian posed as clients at Kurosaki Vehicle Leasing; manager Yamaguchi offered a trial placement. Tomorrow after sundown the courier collects a small cash sum at Shutter Alley (Jostin, Kaito, Haruto, Jovian) while Mikoto, Reiko, Ayame and Yuzuki cover the Amemiya shop and Rin, Hana and Nobu run ops. Jostin is training instead of sleeping.", "clock": "Sundown tomorrow: collectors return to the Amemiya shop; after sundown the courier arrives at Shutter Alley."}, "people": [{"id": "jostin", "name": "Jostin Joestar", "kind": "pc", "role": "Crew Head, Hearth", "division": "", "status": "active", "note": "", "summary": "Crew Head (Hearth, the home). Strategist and extraction specialist. Stand: I Fell In Love With Princess Peach. Co-owns Club Lumiere.", "img": "img/jostin.jpg", "profile": "Stand: I Fell In Love With Princess Peach (IFILWPP): absorbs, stores and redirects kinetic energy by contact\nStyle: Assassin training: surveillance, kusarigama and hidden blade\nWeakness: Overuse tears muscle. It cannot create force from nothing."}, {"id": "jovian", "name": "Jovian Joestar", "kind": "pc", "role": "Crew Head, Spearhead", "division": "", "status": "active", "note": "", "summary": "Crew Head (Spearhead, the field) and brawler. Stand: Breaker's Soul. Co-owns Club Lumiere with Jostin.", "img": "img/jovian.jpg", "profile": "Stand: Breaker's Soul: spectral upper-body warrior of pure physical force\nStyle: Joestar Breathing forms and street brawling\nWeakness: His body pays for big releases (Soul Burn)"}, {"id": "reiko", "name": "Reiko Amagawa", "kind": "crew", "role": "Head Lieutenant; Vanguard Head", "division": "Vanguard", "status": "active", "note": "", "summary": "Head Lieutenant (runs the crew day to day) and head of Vanguard, the tank division. Fights and holds exits; killed an enforcer.", "img": "img/reiko.jpg", "profile": "Faction: Kurokawa Underworld\nRank: Elite, level 11\nHP: 297\nRole: Head lieutenant; covered the alley exit at Tag Night\nOpen: Jostin owes her a private talk"}, {"id": "haruto", "name": "Haruto Saionji", "kind": "crew", "role": "Strategist, Command Head", "division": "Command", "status": "active", "note": "", "summary": "Head of Command and the crew's strategist. Crown Script gold lines freeze or redirect targets.", "img": "img/haruto.jpg", "profile": "Rank: Elite, level 12\nHP: 315\nPower: Crown Script: a gold line holds an enemy once, and does not hold twice\nHolds: Banda's second ledger and Yuji's duffel of cash\nBond: Growing pair with Hana"}, {"id": "mikoto", "name": "Mikoto Kurogane", "kind": "crew", "role": "Strike Head", "division": "Strike", "status": "active", "note": "", "summary": "Enforcer captain. Riot Pulse, Pulse Interrupt. Ended Banda.", "img": "img/mikoto.jpg", "profile": "Rank: Elite, level 11\nHP: 297\nPower: Riot Pulse (red shockwave), Pulse Interrupt\nStatus: Cracked ribs, ice pack"}, {"id": "hana", "name": "Hana Kisaragi", "kind": "crew", "role": "Forge Head", "division": "Forge", "status": "active", "note": "", "summary": "Weapons specialist and workshop engineer. Cold, disciplined, protective.", "img": "img/hana.jpg", "profile": "Rank: Elite, level 10\nHP: 279\nCombat style: protective\nBuilt: Jovian's power knuckles, Jostin's kusarigama and hidden blade\nTag Night: Van and route watching; maps tonight's no-repeat routes"}, {"id": "nobu", "name": "Nobu Takamine", "kind": "crew", "role": "Intelligence", "division": "Command", "status": "active", "note": "", "summary": "Command intelligence: traces, drones, cameras, comms. Drives the van.", "img": "img/nobu.jpg", "profile": "Rank: Elite, level 6\nHP: 207\nAbilities: Field Calibration, Drone Override, Reinforced Tool Belt\nNote: His \"no safehouse, we squat at Lumiere\" line was an AI slip"}, {"id": "yuzuki", "name": "Yuzuki Hoshino", "kind": "crew", "role": "Lifeline Head", "division": "Lifeline", "status": "active", "note": "", "summary": "Healer and head of Lifeline (rescue, recovery, healing). Verdant Sylph, Golden Mend.", "img": "img/yuzuki.jpg", "profile": "Rank: Elite, level 11\nHP: 297\nStand: Verdant Sylph (manifested ); wind wings and a Yuno-style fusion\nOwns: The old bathhouse (inherited)\nAffinity: 88, the highest in the engine"}, {"id": "kaito", "name": "Kaito Arashima", "kind": "crew", "role": "Marksman", "division": "Phantom", "status": "active", "note": "", "summary": "Phantom marksman: tether bolts and cable-bow Horizon Breaker. Full crew member. Not a student. NOT Kaito Serizawa (gym).", "img": "img/kaito.jpg", "profile": "Rank: Elite, level 12\nHP: 315\nVouched by: Josuke Higashikata (via Aurelia)\nDo not confuse: Kaito Serizawa (Tetsu gym) is a different person\nStatus: Full crew member (Phantom marksman, user t387)"}, {"id": "ayame", "name": "Ayame Fujinami", "kind": "crew", "role": "Pulse Head", "division": "Pulse", "status": "active", "note": "", "summary": "School influencer, head of Pulse (media and community). Keeps editorial independence.", "img": "img/ayame.jpg", "profile": "Faction: Chikara Academy\nRank: Elite, level 12\nHP: 315\nJoined: with truthfulness terms\nNow: Her Tag Night stream is trending; Banda face-down in the sand is a meme"}, {"id": "rikona", "name": "Rikona Mibu", "kind": "crew", "role": "", "division": "", "status": "pending", "note": "helping one case", "summary": "Support caster (Kinetic Barrier, Weakening Field, Mending Pulse). Not crew: agreed to help with ONE case (Noa Amemiya). Face known to collectors; her debt was paid; proud, hates owing.", "img": "img/rikona.jpg", "profile": "Faction: Chikara Academy\nRank: Elite, level 11\nHP: 297\nPowers: Mending Pulse, barrier weakening (widened a seam in Kenji's barrier)\nDebt: Cleared by Aurelia, receipt held\nNow: Walked Shun home; off the van"}, {"id": "rin", "name": "Rin", "kind": "crew", "role": "Treasurer, Vault Head", "division
