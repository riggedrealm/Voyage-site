<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Joestar Gang Tracker</title>
<meta name="description" content="Player-facing campaign tracker for the Joestar Gang.">
<style>
:root{--bg:#f6f7f9;--surface:#fff;--s2:#eef0f4;--fg:#161a22;--muted:#5d6676;--line:#dde1e8;--accent:#c8243f;--accent-soft:#fbe7eb;--ok:#12805c;--warn:#a96a00;--bad:#c0302b;--info:#2b6cb0;--r:14px;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0e1117;--surface:#161b24;--s2:#1d2330;--fg:#eef1f6;--muted:#9aa5b8;--line:#2a3243;--accent:#ff6a84;--accent-soft:#3a1a24;--ok:#4cd6a0;--warn:#f2c15a;--bad:#ff7a72;--info:#7ab8ff}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:max(10px,env(safe-area-inset-top)) 16px 0}
.bar{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{font-weight:800;letter-spacing:.01em}.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}
.search{margin-left:auto;flex:1;max-width:280px}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit}
nav{max-width:960px;margin:6px auto 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;padding:9px 12px;border-bottom:3px solid transparent;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap}
nav a[aria-current=page]{color:var(--accent);border-color:var(--accent)}
main{max-width:960px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}.sub{color:var(--muted);margin:0 0 18px}
h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.now{border-left:4px solid var(--accent);padding:16px 18px}
.now .l{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.now p{margin:6px 0 0;font-size:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
button.item{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:14px 16px}
button.item:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.item .t{display:flex;gap:10px;align-items:center}
.av{width:54px;height:54px;border-radius:15px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;overflow:hidden;border:2px solid var(--dv,var(--line))}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.hero{position:relative;overflow:hidden;border-radius:20px;padding:22px 20px 18px;color:#fff;background:linear-gradient(135deg,#c8243f 0%,#6b1d52 55%,#1f2a5a 100%);margin-bottom:6px}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero small{opacity:.8;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.hero h1{font-size:26px;margin:4px 0 2px;color:#fff}.hero .sub{color:rgba(255,255,255,.82);margin:0 0 14px}
.faces{display:flex}.faces .av{width:44px;height:44px;border-radius:50%;border:2px solid #fff;margin-left:-10px;font-size:12px}.faces .av:first-child{margin-left:0}
.card.dvc{border-top:3px solid var(--dv)}
.shot{display:block;width:100%;max-height:340px;object-fit:cover;object-position:50% 10%}
.item b{display:block;font-weight:700;line-height:1.25}.item small{color:var(--muted)}
.item p{margin:8px 0 0;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px;background:var(--s2);border:1px solid var(--line);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.st-active .dot{background:var(--ok)}.st-pending .dot,.st-watch .dot{background:var(--info)}.st-unresolved .dot,.st-fled .dot{background:var(--warn)}.st-dead .dot,.st-hostile .dot,.st-destroyed .dot{background:var(--bad)}
.row{padding:12px 16px;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.row b{display:block}.row p{margin:2px 0 0;color:var(--muted);font-size:14px}
.pr{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--s2);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.pr.high{background:var(--accent-soft);color:var(--accent)}
.done b{text-decoration:line-through;color:var(--muted)}
.tl{margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);list-style:none}
.tl li{position:relative;padding:0 0 16px 14px}
.tl li:before{content:"";position:absolute;left:-24px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--bg)}
.tl b{font-size:12px;color:var(--accent);display:block}
details.card{margin-bottom:10px}
summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;gap:10px;align-items:center}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";margin-left:auto;color:var(--muted)}
details[open] summary:after{content:"\2212"}
.body{padding:0 16px 14px}
.body ul{margin:4px 0 0;padding-left:20px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:18px;padding:0;background:var(--surface);color:var(--fg);width:min(560px,94vw);max-height:88vh}
dialog::backdrop{background:rgba(8,10,16,.55)}
.dh{display:flex;gap:12px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.dh h3{margin:0;font-size:20px}.dh button{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:50%;width:36px;height:36px;font-size:20px;cursor:pointer}
.db{padding:16px 20px 22px;overflow:auto;max-height:calc(88vh - 90px)}
.db p{margin:0 0 12px}.db pre{white-space:pre-wrap;font:inherit;color:var(--muted);margin:0}
.foot{color:var(--muted);font-size:12px;text-align:center;padding:24px 16px}
@media (max-width:700px){
header{padding-bottom:10px}
nav{position:fixed;left:0;right:0;bottom:0;max-width:none;margin:0;gap:0;overflow:visible;background:var(--surface);border-top:1px solid var(--line);padding:0 0 env(safe-area-inset-bottom);z-index:6}
nav a{flex:1;text-align:center;padding:12px 0 11px;font-size:11.5px;border-bottom:0;border-top:3px solid transparent}
nav a[aria-current=page]{border-top-color:var(--accent)}
main{padding-bottom:92px}
dialog{width:100vw;max-width:100vw;margin:auto 0 0;max-height:92vh;border-radius:18px 18px 0 0;border-bottom:0}
}
@media (max-width:560px){.search{max-width:none}.brand small{display:none}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<script>
var D={"now": {"when": "Monday night", "location": "Club Lumiere, Kobuncho (night; crew resting)", "summary": "The crew is back at Club Lumiere after the Kagero fight. Haruto briefed: Intelligence and Finance remain; threads are Rin's courier route, Rikona's collector face, and Nobu's footage (the handler left by sedan, plate unresolved). Noa has a room upstairs; Reiko is guarding the Amemiya shop. Jovian told everyone to rest; Finance planning is tomorrow.", "clock": "Night. Nobu's plate result and Rin's loan numbers are due in the morning."}, "people": [{"id": "jostin", "name": "Jostin Joestar", "kind": "pc", "role": "Lead", "division": "Phantom", "status": "active", "note": "", "summary": "Strategist and extraction specialist. Stand: I Fell In Love With Princess Peach.", "img": "img/jostin.jpg", "profile": "Stand: I Fell In Love With Princess Peach (IFILWPP): absorbs, stores and redirects kinetic energy by contact\nStyle: Assassin training: surveillance, kusarigama and hidden blade\nWeakness: Overuse tears muscle. It cannot create force from nothing."}, {"id": "jovian", "name": "Jovian Joestar", "kind": "pc", "role": "Lead", "division": "Vanguard", "status": "active", "note": "", "summary": "Crew boss and brawler. Stand: Breaker's Soul. Owns Club Lumiere.", "img": "img/jovian.jpg", "profile": "Stand: Breaker's Soul: spectral upper-body warrior of pure physical force\nStyle: Joestar Breathing forms and street brawling\nWeakness: His body pays for big releases (Soul Burn)"}, {"id": "reiko", "name": "Reiko Amagawa", "kind": "crew", "role": "", "division": "Command", "status": "active", "note": "", "summary": "Head lieutenant. Fights and holds exits; killed an enforcer.", "img": "img/reiko.jpg", "profile": "Faction: Kurokawa Underworld\nRank: Elite, level 11\nHP: 297\nRole: Head lieutenant; covered the alley exit at Tag Night\nOpen: Jostin owes her a private talk"}, {"id": "haruto", "name": "Haruto Saionji", "kind": "crew", "role": "Lead", "division": "Command", "status": "active", "note": "", "summary": "Tactician. Crown Script gold lines freeze or redirect targets.", "img": "img/haruto.jpg", "profile": "Rank: Elite, level 12\nHP: 315\nPower: Crown Script: a gold line holds an enemy once, and does not hold twice\nHolds: Banda's second ledger and Yuji's duffel of cash\nBond: Growing pair with Hana"}, {"id": "mikoto", "name": "Mikoto Kurogane", "kind": "crew", "role": "", "division": "Vanguard", "status": "active", "note": "", "summary": "Enforcer captain. Riot Pulse, Pulse Interrupt. Ended Banda.", "img": "img/mikoto.jpg", "profile": "Rank: Elite, level 11\nHP: 297\nPower: Riot Pulse (red shockwave), Pulse Interrupt\nStatus: Cracked ribs, ice pack"}, {"id": "hana", "name": "Hana Kisaragi", "kind": "crew", "role": "Engineering", "division": "Forge", "status": "active", "note": "", "summary": "Weapons specialist and workshop engineer. Cold, disciplined, protective.", "img": "img/hana.jpg", "profile": "Rank: Elite, level 10\nHP: 279\nCombat style: protective\nBuilt: Jovian's power knuckles, Jostin's kusarigama and hidden blade\nTag Night: Van and route watching; maps tonight's no-repeat routes"}, {"id": "nobu", "name": "Nobu Takamine", "kind": "crew", "role": "Intel", "division": "Forge", "status": "active", "note": "", "summary": "Field technician and quartermaster. Drives the van; runs drone and comms.", "img": "img/nobu.jpg", "profile": "Rank: Elite, level 6\nHP: 207\nAbilities: Field Calibration, Drone Override, Reinforced Tool Belt\nNote: His \"no safehouse, we squat at Lumiere\" line was an AI slip"}, {"id": "yuzuki", "name": "Yuzuki Hoshino", "kind": "crew", "role": "Lead", "division": "Lifeline", "status": "active", "note": "", "summary": "Healer and Lifeline division lead. Verdant Sylph, Golden Mend.", "img": "img/yuzuki.jpg", "profile": "Rank: Elite, level 11\nHP: 297\nStand: Verdant Sylph (manifested ); wind wings and a Yuno-style fusion\nOwns: The old bathhouse (inherited)\nAffinity: 88, the highest in the engine"}, {"id": "kaito", "name": "Kaito Arashima", "kind": "crew", "role": "Archer", "division": "Phantom", "status": "active", "note": "", "summary": "Ranged support: tether bolts and cable-bow Horizon Breaker. Not a student. NOT Kaito Serizawa (gym).", "img": "img/kaito.jpg", "profile": "Rank: Elite, level 12\nHP: 315\nVouched by: Josuke Higashikata (via Aurelia)\nDo not confuse: Kaito Serizawa (Tetsu gym) is a different person\nEngine note: Still deciding whether to commit fully"}, {"id": "ayame", "name": "Ayame Fujinami", "kind": "crew", "role": "Lead", "division": "Pulse", "status": "active", "note": "", "summary": "School influencer, head of the Beacon media division. Keeps editorial independence.", "img": "img/ayame.jpg", "profile": "Faction: Chikara Academy\nRank: Elite, level 12\nHP: 315\nJoined: with truthfulness terms\nNow: Her Tag Night stream is trending; Banda face-down in the sand is a meme"}, {"id": "rikona", "name": "Rikona Mibu", "kind": "crew", "role": "", "division": "", "status": "pending", "note": "helping one case", "summary": "Support caster (Kinetic Barrier, Weakening Field, Mending Pulse). Not crew: agreed to help with ONE case (Noa Amemiya). Face known to collectors; her debt was paid; proud, hates owing.", "img": "img/rikona.jpg", "profile": "Faction: Chikara Academy\nRank: Elite, level 11\nHP: 297\nPowers: Mending Pulse, barrier weakening (widened a seam in Kenji's barrier)\nDebt: Cleared by Aurelia, receipt held\nNow: Walked Shun home; off the van"}, {"id": "rin", "name": "Rin", "kind": "crew", "role": "Treasurer", "division": "Command", "status": "active", "note": "", "summary": "Ex House door clerk, hired t327 as Treasurer on probation (finance and operational logistics). Dry, tired, blunt.", "img": "img/rin.jpg", "profile": "Rank: Weak, level 11\nHP: 99\nNote: Hired t327 on one-month probation: receipts for everything, Nobu can audit unannounced, one-strike clause. Formerly Kurokawa (House clerk); no loyalty to them."}, {"id": "aurelia", "name": "Aurelia Voss", "kind": "ally", "role": "", "division": "", "status": "active", "note": "", "summary": "Speedwagon liaison. Funds repairs, gear, cars, Rikona's debt.", "img": "img/aurelia.jpg"}, {"id": "gara", "name": "Gara", "kind": "ally", "role": "", "division": "", "status": "active", "note": "", "summary": "Shutter Alley information broker in a hidden third-floor workshop.", "img": "img/gara.jpg"}, {"id": "maki", "name": "Maki Hayashida", "kind": "ally", "role": "", "division": "", "status": "active", "note": "", "summary": "Club Lumiere manager and records keeper. Hostesses under her: Airi Kurosawa, Mirei Tachibana, Noa Amemiya, Rika Saotome, Sena Amagawa (user canon t327; Chiho/Tomoe/Kaede are not hostesses). Natsumi Arai runs the stock room.", "img": "img/maki.jpg"}, {"id": "tetsu", "name": "Tetsu", "kind": "ally", "role": "Gym master", "division": "", "status": "active", "note": "", "summary": "Gruff gym master of Tetsu Iron Palm Gym.", "img": "img/tetsu.jpg"}, {"id": "riko", "name": "Riko Amane", "kind": "ally", "role": "Trainer", "division": "", "status": "active", "note": "", "summary": "Trainer who teaches Jostin control and Stillpoint.", "img": "img/riko.jpg"}, {"id": "sayaka", "name": "Sayaka Mizuhara", "kind": "ally", "role": "Gym regular", "division": "", "status": "active", "note": "", "summary": "Regular at Tetsu Iron Palm Gym.", "img": "img/sayaka.jpg"}, {"id": "genta", "name": "Genta Oda", "kind": "ally", "role": "Gym regular", "division": "", "status": "active", "note": "", "summary": "Regular at Tetsu Iron Palm Gym.", "img": "img/genta.jpg"}, {"id": "masaru", "name": "Masaru Hachiya", "kind": "ally", "role": "Gym regular", "division": "", "status": "active", "note": "", "summary": "Regular at Tetsu Iron Palm Gym.", "img": "img/masaru.jpg"}, {"id": "kaito-serizawa", "name": "Kaito Serizawa", "kind": "ally", "role": "Gym regular", "division": "", "status": "active", "note": "", "summary": "Gym regular who wants a Thursday rematch with Jovian.", "img": "img/kaito-serizawa.jpg"}, {"id": "anya", "name": "Principal Anya", "kind": "ally", "role": "", "division": "", "status": "watch", "note": "", "summary": "Holds a conditional-expulsion agreement over both brothers.", "img": "img/anya.jpg"}, {"id": "kenji", "name": "Kenji Aoi", "kind": "ally", "role": "", "division": "", "status": "pending", "note": "", "summary": "Seiran Tech battle mage (triple violet barriers). Quit The House in disgust, then helped against Banda.", "img": "img/kenji.jpg"}, {"id": "shun", "name": "Shun", "kind": "ally", "role": "", "division": "", "status": "active", "note": "", "summary": "16-year-old neighbor of Rikona, taken for The House. Rescued.", "img": "img/shun.jpg"}, {"id": "daiki", "name": "Daiki", "kind": "ally", "role": "", "division": "", "status": "active", "note": "", "summary": "Ally prisoner used as a living battery. Power: Energy Shunt.", "img": "img/daiki.jpg"}, {"id": "others", "name": "Other contacts", "kind": "ally", "role": "", "division": "", "status": "active", "note": "", "summary": "Sonobe, Old Man Koga, Dr. Kiyose, shop owners, Keito Takeda."}, {"id": "daigo", "name": "Daigo Renjiro", "kind": "enemy", "role": "", "division": "", "status": "hostile", "note": "", "summary": "True boss of the Kurokawa syndicate. Puppets people; uses tunnels.", "img": "img/daigo.jpg"}, {"id": "banda", "name": "Banda", "kind": "enemy", "role": "", "division": "", "status": "dead", "note": "", "summary": "Captain of The House. Ex-MMA, enhancer syringe. Dead (0 HP).", "img": "img/banda.jpg"}, {"id": "yuji", "name": "Yuji", "kind": "enemy", "role": "", "division": "", "status": "fled", "note": "", "summary": "The House's payout runner. Ran off with nothing.", "img": "img/yuji.jpg"}, {"id": "goro", "name": "Goro", "kind": "enemy", "role": "Kenji Aoi's tag partner", "division": "", "status": "unresolved", "note": "", "summary": "Kenji Aoi's tag partner at Tag Night. Cheated with a hidden knuckle spike.", "img": "img/goro.jpg"}, {"id": "
